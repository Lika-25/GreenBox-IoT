<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати кіберпогрозу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <h2 class="text-success mb-4" style="font-weight: 500;">Нова кіберпогроза 🛡️</h2>
        
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted">{{ form.name.label_tag }}</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">{{ form.category.label_tag }}</label>
                        {{ form.category }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">{{ form.severity.label_tag }}</label>
                        {{ form.severity }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">{{ form.vector.label_tag }}</label>
                        {{ form.vector }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">{{ form.target_node.label_tag }}</label>
                        {{ form.target_node }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">{{ form.status.label_tag }}</label>
                        {{ form.status }}
                    </div>
                    <hr></hr>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'security_list' %}" class="btn btn-light border">Скасувати</a>
                        <button type="submit" class="btn btn-success">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
