[uwsgi]
# Вкажіть тут абсолютний шлях до папки з проектом
chdir = /path/to/your/project/GreenBox
module = GreenBox.wsgi

# Вкажіть шлях до вашого віртуального середовища
virtualenv = /path/to/your/project/GreenBox/env

socket = 127.0.0.1:8080
chmod-socket = 666
master = true
processes = 2
vacuum = true
buffer-size = 32768