[program:greenbox]
# Замініть шляхи на свої
command=/path/to/your/project/GreenBox/env/bin/uwsgi --ini /path/to/your/project/GreenBox/uwsgi.ini
directory=/path/to/your/project/GreenBox
autostart=true
autorestart=true
stdout_logfile=/path/to/your/project/GreenBox/logs/supervisor.log
stderr_logfile=/path/to/your/project/GreenBox/logs/supervisor_err.log